<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJMP ID - eVerify</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="logo-container">
    <img src="logo.png" alt="BJMP Logo" class="brand-logo">
  </div>
  
 <h2>BJMP ID | <i>e</i>Verify</h2>
  <p class="subtitle">BJMP ID VERIFICATION SYSTEM</p>
  
   <div class="form-group">
    <input type="text" id="idInput" placeholder="Enter ID Number">
    <input type="text" id="lastNameInput" placeholder="Enter Last Name">
    <button id="verifyBtn">
      <span id="btnText">VERIFY</span>
      <span id="btnSpinner" class="button-spinner" style="display: none;"></span>
    </button>
  </div>

  <div id="loader" class="loader">Verifying record...</div>
  <div id="statusMessage" class="status-msg"></div>

  <div id="resultContainer">
    <div class="data-row">
      <div class="data-label">ID Number</div>
      <div class="data-value" id="resId"></div>
    </div>
    <div class="data-row">
      <div class="data-label">Rank</div>
      <div class="data-value" id="resRank"></div>
    </div>
    <div class="data-row">
      <div class="data-label">Full Name</div>
      <div class="data-value" id="resName"></div>
    </div>
    <div class="data-row">
      <div class="data-label">Status</div>
      <div class="data-value"><span id="resValidity" class="badge"></span></div>
    </div>
  </div>

  <hr class="divider">
    
  <div class="card-footer">
    <div class="dev-badge">
      <span class="terminal-icon">&gt;_</span>
      <span class="dev-text">Developed by</span>
      <span class="dev-team">DPRM ICT DevTeam</span>
    </div>
</div>
  
</div>

<script src="script.js"></script>
</body>
</html>
